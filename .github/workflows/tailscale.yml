name: fetch-tailscale
on:
  push:
    paths: [".github/workflows/tailscale.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - name: Download Tailscale installer
        run: |
          mkdir out && cd out
          curl -fsSL -o tailscale-setup.exe https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe
          ls -la
          git init -q -b tools
          git config user.name "bilsan-build"; git config user.email "build@users.noreply.github.com"
          git add -A; git commit -q -m "tailscale"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" tools
