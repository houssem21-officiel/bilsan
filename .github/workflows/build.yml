name: build-installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          Start-Transcript build-log.txt
          try { ./tools/build.ps1; "OK" | Out-File build-status.txt } catch { $_ | Out-String | Out-File build-status.txt; Stop-Transcript; exit 1 }
          Stop-Transcript
      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bilsan-installers
          path: dist/installers/*.exe
          if-no-files-found: ignore
      # ملفات التثبيت + سجل البناء في فرع dist (ليأخذها Claude ويرسلها)
      - name: Publish to dist branch
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item build-log.txt, build-status.txt out -ErrorAction SilentlyContinue
          Copy-Item dist/installers/*.exe out -ErrorAction SilentlyContinue
          Set-Location out
          git init -q -b dist
          git config user.name "bilsan-build"
          git config user.email "build@users.noreply.github.com"
          git add -A
          git commit -q -m "build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist
