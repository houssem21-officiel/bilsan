name: build-android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build APK
        run: |
          export KS_FILE="$GITHUB_WORKSPACE/android/keystore/bilsan.jks"
          export KS_PASS="$(cat android/keystore/pass.txt)"
          export APP_CODE="${GITHUB_RUN_NUMBER}"
          export APP_VER="1.${GITHUB_RUN_NUMBER}"
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk Bilsan-Director.apk
      - uses: actions/upload-artifact@v4
        with: { name: Bilsan-Director, path: Bilsan-Director.apk }
